name: Nepal River Basin Flood Early Warning Monitor

on:
  schedule:
    # Run every 15 minutes (24/7 automated flood watch at $0 cost)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'once'
        type: choice
        options:
          - once
          - test-alert
          - broadcast-status
          - status
      mock:
        description: 'Force realistic mock data'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (preview without sending real Telegram message)'
        required: false
        default: false
        type: boolean

concurrency:
  group: flood-monitor
  cancel-in-progress: false

jobs:
  monitor-and-alert:
    name: Poll River Telemetry & Broadcast Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Alert Cooldown State
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: flood-bot-state-${{ github.run_id }}
          restore-keys: |
            flood-bot-state-

      - name: Ensure State File Exists
        run: |
          mkdir -p data
          if [ ! -f data/state.json ]; then
            echo "{}" > data/state.json
          fi

      - name: Run Flood Monitoring Cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALERT_COOLDOWN_MINUTES: ${{ vars.ALERT_COOLDOWN_MINUTES || '120' }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "test-alert" ]; then
              EXTRA_FLAGS="--test-alert"
            elif [ "${{ inputs.mode }}" = "broadcast-status" ]; then
              EXTRA_FLAGS="--broadcast-status"
            elif [ "${{ inputs.mode }}" = "status" ]; then
              EXTRA_FLAGS="--status"
            else
              EXTRA_FLAGS="--once"
            fi
            if [ "${{ inputs.mock }}" = "true" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS --mock"
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"
            fi
          else
            # Scheduled run: Check for Daily Morning (01:15 UTC = 7:00 AM NPT)
            # or Evening Briefing (12:15 UTC = 6:00 PM NPT)
            CURRENT_HOUR=$(date -u +%H)
            CURRENT_MIN=$(date -u +%M)
            if [ "$CURRENT_HOUR" = "01" ] && [ "$CURRENT_MIN" -ge "10" ] && [ "$CURRENT_MIN" -le "25" ]; then
              echo "🌅 Morning Hydrology Briefing (7:00 AM NPT)"
              EXTRA_FLAGS="--broadcast-status"
            elif [ "$CURRENT_HOUR" = "12" ] && [ "$CURRENT_MIN" -ge "10" ] && [ "$CURRENT_MIN" -le "25" ]; then
              echo "🌆 Evening Hydrology Briefing (6:00 PM NPT)"
              EXTRA_FLAGS="--broadcast-status"
            else
              EXTRA_FLAGS="--once"
            fi
          fi

          echo "Executing: python main.py $EXTRA_FLAGS"
          python main.py $EXTRA_FLAGS

      - name: Deploy Live Dashboard Snapshot & History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/stations_live.json data/history.csv || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update live dashboard snapshot & history [skip ci]" && git push origin main) || true

      - name: Save Alert Cooldown State
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/state.json
          key: flood-bot-state-${{ github.run_id }}
